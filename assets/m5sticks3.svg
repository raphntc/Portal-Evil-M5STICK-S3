<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="M5StickS3 running Portal Evil HUEBR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11141b"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="0.5" stop-color="#f4610a"/>
      <stop offset="1" stop-color="#c94600"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#388bff"/>
      <stop offset="1" stop-color="#124aaa"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#b01010"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="360" height="240" fill="url(#bg)"/>

  <!-- device body -->
  <g filter="url(#sh)">
    <rect x="128" y="20" width="104" height="200" rx="18" fill="url(#body)" stroke="#8c3200" stroke-width="2"/>
    <!-- body bevel highlight -->
    <rect x="134" y="26" width="92" height="188" rx="14" fill="none" stroke="#ffae6b" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- screen -->
  <rect x="146" y="40" width="68" height="104" rx="6" fill="url(#screen)" stroke="#000" stroke-width="2"/>

  <!-- screen: header bar -->
  <rect x="148" y="42" width="64" height="16" rx="3" fill="url(#hdr)"/>
  <text x="180" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">PORTAL EVIL</text>

  <!-- screen: tiny skull -->
  <g transform="translate(180,92)">
    <ellipse cx="0" cy="0" rx="20" ry="17" fill="#e2e6ee"/>
    <ellipse cx="1" cy="2" rx="20" ry="17" fill="#9ca6ba" opacity="0.25"/>
    <rect x="-11" y="12" width="22" height="13" rx="6" fill="#e2e6ee"/>
    <ellipse cx="-8" cy="-1" rx="5.5" ry="6.5" fill="#0a0b10"/>
    <ellipse cx="8" cy="-1" rx="5.5" ry="6.5" fill="#0a0b10"/>
    <ellipse cx="-8" cy="0" rx="3" ry="3.4" fill="url(#eye)"/>
    <ellipse cx="8" cy="0" rx="3" ry="3.4" fill="url(#eye)"/>
    <polygon points="0,6 -3,13 3,13" fill="#0a0b10"/>
    <g stroke="#9ca6ba" stroke-width="1">
      <line x1="-8" y1="17" x2="-8" y2="24"/>
      <line x1="0" y1="17" x2="0" y2="24"/>
      <line x1="8" y1="17" x2="8" y2="24"/>
    </g>
  </g>

  <!-- screen: victim counter card -->
  <rect x="150" y="122" width="60" height="18" rx="4" fill="#171a21"/>
  <text x="155" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="6" fill="#8a93a6">VICTIMS</text>
  <text x="205" y="135" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffc400">13</text>

  <!-- front M5 button -->
  <circle cx="180" cy="178" r="15" fill="#2a2d33" stroke="#000" stroke-width="2"/>
  <circle cx="180" cy="178" r="15" fill="none" stroke="#5a5f68" stroke-width="1" opacity="0.6"/>
  <text x="180" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#c9ced8">M5</text>

  <!-- power LED -->
  <circle cx="180" cy="205" r="3" fill="#36d07a"/>

  <!-- side button -->
  <rect x="124" y="96" width="6" height="26" rx="3" fill="#b9450a"/>
  <!-- USB-C bottom -->
  <rect x="166" y="218" width="28" height="6" rx="3" fill="#2a2d33"/>

  <!-- label -->
  <text x="60" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">M5StickS3</text>
  <text x="61" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8ab0ff">ESP32-S3 &#183; 135&#215;240 LCD</text>
  <text x="61" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8a93a6">speaker &#183; 8MB flash + PSRAM</text>
</svg>
